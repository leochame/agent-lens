listen:
  host: 0.0.0.0
  port: 5290
routing:
  defaultProvider: openai-gateway
  routes:
    - pathPrefix: /openai
      provider: openai-gateway
      apiFormat: openai
      stripPrefix: true
    - pathPrefix: /anthropic
      provider: anthropic-gateway
      apiFormat: anthropic
      stripPrefix: true
  byHeader: x-target-provider
  byPathPrefix: {}
  autoDetectProviderByFormat: true
  formatProviders:
    anthropic: anthropic-gateway
    openai: openai-gateway
providers:
  openai-gateway:
    baseURL: https://your-openai-proxy.com/v1
    authMode:
      type: inject
      header: authorization
      value: ${OPENAI_API_KEY:-your-api-key-here}
      valuePrefix: "Bearer "
    pathRewrite: []
  anthropic-gateway:
    baseURL: https://your-anthropic-proxy.com
    authMode:
      type: inject
      header: x-api-key
      value: ${ANTHROPIC_API_KEY:-your-api-key-here}
    pathRewrite: []
    modelOverride: glm-4
logging:
  filePath: ./logs/requests.jsonl
  archiveRequests: true
  maxArchiveBodyBytes: 0
  redactHeaders:
    - authorization
    - x-api-key
    - cookie
    - set-cookie
requestTimeoutMs: 120000
