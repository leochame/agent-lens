listen:
  host: 0.0.0.0
  port: 5290
routing:
  defaultProvider: ruoli.dev - gpt
  routes:
    - pathPrefix: /openai
      provider: https://windhub.cc
      apiFormat: openai
      stripPrefix: true
    - pathPrefix: /anthropic
      provider: https://zhiyingai.online
      apiFormat: anthropic
      stripPrefix: true
  byHeader: x-target-provider
  byPathPrefix: {}
  autoDetectProviderByFormat: true
  formatProviders:
    anthropic: anyrouter
    openai: ruoli.dev - gpt
providers:
  ruoli.dev - gpt:
    baseURL: https://ruoli.dev/v1
    authMode:
      type: inject
      header: authorization
      value: ${RUOLI_GPT_API_KEY:-}
      valuePrefix: "Bearer "
    pathRewrite: []
  anyrouter:
    baseURL: https://anyrouter.top
    modelOverride: claude-opus-4.7[1M]
    authMode:
      type: inject
      header: x-api-key
      value: sk-2OJgg2pvHFeFVJN2T7g6bfIIIgWBgUr5tEHGiLUy6KdS18CP
    pathRewrite: []
  智谱-ruoli:
    baseURL: https://ruoli.dev
    modelOverride: deepseek-expert-reasoner
    authMode:
      type: inject
      header: authorization
      value: sk-kkDAWeNjXExZf2zLHtcpO35SAEpMLrJm6JX56gjwtmzDF1PI
      valuePrefix: "Bearer "
    pathRewrite: []
  https://windhub.cc:
    baseURL: https://windhub.cc/v1
    authMode:
      type: inject
      header: authorization
      value: sk-FFPm6nP0S2Yr8TobzoKanxPclsISEZFOvvg7nSkIsrO4m00M
      valuePrefix: "Bearer "
    pathRewrite: []
    modelOverride: gpt-5.4
  https://zhiyingai.online:
    baseURL: https://zhiyingai.online
    modelOverride: glm-5.1
    authMode:
      type: inject
      header: authorization
      value: sk-BRsqqUyRFpPZKbASBKCpIDyvKMchB08PqMHzDJgkfPmEECSY
      valuePrefix: "Bearer "
    pathRewrite: []
  https://api.xixixixi.cloud:
    baseURL: https://api.xixixixi.cloud
    authMode:
      type: inject
      header: authorization
      value: sk-zhBsrproC2i2U1D0pFkCa8a6S4WFOVYuZTaCZsey8S4gD96j
      valuePrefix: "Bearer "
    pathRewrite: []
logging:
  filePath: ./logs/requests.jsonl
  archiveRequests: true
  maxArchiveBodyBytes: 0
  redactHeaders:
    - authorization
    - x-api-key
    - cookie
    - set-cookie
requestTimeoutMs: 120000
